name: Binance Square V4 Viral Human Write-to-Earn Bot

on:
  schedule:
    # ১. Asian Session Peak (02:30 UTC -> সকাল ০৮:৩০ বাংলাদেশ সময়) - 1 post
    - cron: '30 2 * * *'
    # ২. London & European Open (08:15 UTC -> দুপুর ০২:১৫ বাংলাদেশ সময়) - 1 post
    - cron: '15 8 * * *'
    # ৩. Pre-US / London Mid-Session (11:45 UTC -> বিকাল ০৫:৪৫ বাংলাদেশ সময়) - 1 post
    - cron: '45 11 * * *'
    # ৪. US & London Overlap Peak (14:20 & 17:35 UTC -> রাত ০৮:২০ ও রাত ১১:৩৫ বাংলাদেশ সময়) - 2 posts
    - cron: '20 14 * * *'
    - cron: '35 17 * * *'
    # ৫. Late US / Daily Candle Close (21:10 UTC -> ভোর ০৩:১০ বাংলাদেশ সময়) - 1 post
    - cron: '10 21 * * *'

  workflow_dispatch:
    inputs:
      force_format:
        description: 'Optional format (MOBILE_ARROW_CHART, PRO_SETUP_BOX_CHART, VOLATILITY_SHOCK_CARD, TRADER_POLL, CHEAT_SHEET_ALPHA, DUAL_COMBO_POST)'
        required: false
        default: ''

concurrency:
  group: binance-square-autobot
  cancel-in-progress: false

jobs:
  publish-square-post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore Bot Anti-Repetition Memory Cache
        uses: actions/cache/restore@v4
        with:
          path: bot_memory.json
          key: square-bot-memory-${{ github.run_id }}
          restore-keys: |
            square-bot-memory-

      - name: Install Python Chart Libraries
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib numpy requests requests_oauthlib

      - name: Download Official Binance Square Skill Scripts
        run: |
          mkdir -p square-post
          GH_HOST="https://github.com"
          REPO_PATH="binance/binance-skills-hub/archive/refs/heads/main.zip"
          curl -sL "${GH_HOST}/${REPO_PATH}" -o hub.zip
          unzip -q hub.zip
          cp -r binance-skills-hub-main/skills/binance/square-post/* square-post/
          rm -rf hub.zip binance-skills-hub-main
          ls -la square-post/scripts

      - name: Generate & Publish Viral Human Post
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          SQUARE_SKILL_DIR: square-post
          FORCE_FORMAT: ${{ github.event.inputs.force_format }}
        run: |
          SCRIPT_NAME="binance_square_autobot.py"
          if [ -n "$FORCE_FORMAT" ]; then
            python "$SCRIPT_NAME" --once --square-skill-dir square-post --format "$FORCE_FORMAT"
          else
            python "$SCRIPT_NAME" --once --square-skill-dir square-post
          fi

      - name: Save Updated Bot Memory Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: bot_memory.json
          key: square-bot-memory-${{ github.run_id }}
