name: Binance Square V5 High-Reach Narrative Bot

on:
  schedule:
    # ১. Asian Session Momentum (02:20 UTC -> সকাল ০৮:২০ BST)
    - cron: '20 2 * * *'
    # ২. London Open Liquidity (08:35 UTC -> দুপুর ০২:৩৫ BST)
    - cron: '35 8 * * *'
    # ৩. US & London Overlap Peak (14:40 UTC -> রাত ০৮:৪০ BST)
    - cron: '40 14 * * *'
    # ৪. Late US / Daily Close Setup (20:50 UTC -> রাত ০২:৫০ BST)
    - cron: '50 20 * * *'

  workflow_dispatch:
    inputs:
      force_format:
        description: 'Optional pillar (BREAKING_NEWS_TAKE, HIGH_CONVICTION_CHART, TRADING_PSYCHOLOGY, COMMUNITY_DEBATE)'
        required: false
        default: ''

concurrency:
  group: binance-square-autobot
  cancel-in-progress: false

jobs:
  publish-square-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Anti-Bot Random Timing Jitter (Scheduled Runs Only)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 480))
          echo "Waiting ${DELAY}s for natural human posting cadence..."
          sleep "$DELAY"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore Bot Anti-Repetition Memory Cache
        uses: actions/cache/restore@v4
        with:
          path: bot_memory.json
          key: square-bot-memory-v5-${{ github.run_id }}
          restore-keys: |
            square-bot-memory-v5-

      - name: Install Python Chart Libraries
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib numpy

      - name: Download Official Binance Square Skill Scripts
        run: |
          mkdir -p square-post
          GH_HOST="[https://github.com](https://github.com)"
          REPO_PATH="binance/binance-skills-hub/archive/refs/heads/main.zip"
          curl -sL "${GH_HOST}/${REPO_PATH}" -o hub.zip
          unzip -q hub.zip
          cp -r binance-skills-hub-main/skills/binance/square-post/* square-post/
          rm -rf hub.zip binance-skills-hub-main

      - name: Generate & Publish High-Reach Post
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          SQUARE_SKILL_DIR: square-post
          FORCE_FORMAT: ${{ github.event.inputs.force_format }}
        run: |
          if [ -n "$FORCE_FORMAT" ]; then
            python binance_square_autobot.py --once --square-skill-dir square-post --format "$FORCE_FORMAT"
          else
            python binance_square_autobot.py --once --square-skill-dir square-post
          fi

      - name: Save Updated Bot Memory Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: bot_memory.json
          key: square-bot-memory-v5-${{ github.run_id }}
